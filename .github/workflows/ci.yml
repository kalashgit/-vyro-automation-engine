name: CI

on:
  push:
    branches: [main, phase-2/persistent-queue]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PostgreSQL tests and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vyro_test
          POSTGRES_USER: vyro
          POSTGRES_PASSWORD: local-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyro -d vyro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://vyro:local-ci-fixture-only@127.0.0.1:5432/vyro_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test migrations, transactional claims, fencing, retries, and recovery
        run: npm test
      - name: Verify migration CLI against the disposable CI database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_SSL_MODE: disable
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Build production application
        run: npm run build
      - name: Verify production HTTP routes and admin authentication
        run: npm run test:smoke
